services:
  # Service untuk Laravel
  backend:
    build:
      context: ./backend
    container_name: laravel_api
    environment:
      DB_CONNECTION: mysql
      DB_HOST: ${DOCKER_DB_HOST:-host.docker.internal}
      DB_PORT: ${DOCKER_DB_PORT:-3306}
      DB_DATABASE: ${DOCKER_DB_DATABASE:-vocaseek}
      DB_USERNAME: ${DOCKER_DB_USERNAME:-root}
      DB_PASSWORD: ${DOCKER_DB_PASSWORD-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor

  # Service untuk memproses queue Laravel (email verifikasi, reset password, dll.)
  queue:
    build:
      context: ./backend
    container_name: laravel_queue
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    environment:
      DB_CONNECTION: mysql
      DB_HOST: ${DOCKER_DB_HOST:-host.docker.internal}
      DB_PORT: ${DOCKER_DB_PORT:-3306}
      DB_DATABASE: ${DOCKER_DB_DATABASE:-vocaseek}
      DB_USERNAME: ${DOCKER_DB_USERNAME:-root}
      DB_PASSWORD: ${DOCKER_DB_PASSWORD-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
    depends_on:
      - backend

  # Service untuk React
  frontend:
    build:
      context: ./frontend
    container_name: react_app
    ports:
      - "5173:5173" # Sesuaikan jika menggunakan Vite (biasanya 5173) atau 3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true

  # Service untuk Database
  # Opsional: aktifkan hanya kalau ingin database ikut Docker:
  # docker compose --profile docker-db up -d
  mysql_db:
    image: mysql:8.0
    container_name: mysql_db
    profiles:
      - docker-db
    restart: always
    environment:
      MYSQL_DATABASE: vocaseek
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
  backend_vendor:
