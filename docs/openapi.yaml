openapi: 3.0.3
info:
  title: Vocaseek API
  version: 1.0.0
  description: Ringkasan endpoint auth dan onboarding untuk integrasi frontend.
servers:
  - url: http://localhost:8000/api
    description: Local
tags:
  - name: Auth
  - name: Intern
  - name: Company
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    LoginResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        token:
          type: string
        role:
          type: string
          example: intern
        user:
          type: string
          example: Rendra
    GoogleTokenRequest:
      type: object
      required: [access_token]
      properties:
        access_token:
          type: string
          description: Access token dari Google Identity Services pada frontend.
    MeResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: object
          properties:
            user_id:
              type: integer
            nama:
              type: string
            email:
              type: string
            role:
              type: string
            notelp:
              type: string
            google_id:
              type: string
              nullable: true
paths:
  /login:
    post:
      tags: [Auth]
      summary: Login email/password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Login gagal
  /register:
    post:
      tags: [Auth]
      summary: Registrasi user
      description: Gunakan `multipart/form-data` untuk role company karena ada upload file PDF.
      responses:
        '201':
          description: Registrasi berhasil
        '422':
          description: Validasi gagal
  /auth/google:
    get:
      tags: [Auth]
      summary: Mulai login Google via browser redirect
      responses:
        '302':
          description: Redirect ke Google OAuth
  /auth/google/token:
    post:
      tags: [Auth]
      summary: Login Google untuk SPA/mobile via access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleTokenRequest'
      responses:
        '200':
          description: Login Google berhasil
        '401':
          description: Token Google tidak valid
  /forgot-password:
    post:
      tags: [Auth]
      summary: Kirim email reset password
      responses:
        '200':
          description: Link reset terkirim
  /reset-password:
    post:
      tags: [Auth]
      summary: Set password baru
      responses:
        '200':
          description: Password berhasil diubah
  /me:
    get:
      tags: [Auth]
      summary: Ambil data user login
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profil user login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Unauthorized
  /logout:
    post:
      tags: [Auth]
      summary: Logout token aktif
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout berhasil
  /intern/profile:
    get:
      tags: [Intern]
      summary: Ambil profil intern
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profil intern
  /intern/update-profile:
    put:
      tags: [Intern]
      summary: Update profil intern
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profil terupdate
  /company/profile:
    get:
      tags: [Company]
      summary: Ambil profil company
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profil company
  /company/dashboard:
    get:
      tags: [Company]
      summary: Ambil dashboard company
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Statistik dashboard
